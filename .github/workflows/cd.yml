name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest \
            .

      - name: Push image (sha tag)
        run: docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}

      - name: Push image (latest tag)
        run: docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      # The repo is the source of truth for compose + nginx configs. Without
      # this step, those files on EC2 drift from main: scp creates a new inode,
      # nginx-container's bind mount stays attached to the old (now-deleted)
      # inode, and the container keeps serving the previous config until
      # someone manually recreates it. Pushing them on every deploy makes the
      # repo authoritative.
      - name: Sync prod configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/nginx.conf"
          target: "/opt/llm-portrait"

      - name: SSH and update stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/llm-portrait
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker compose -f docker-compose.prod.yml pull
            # --force-recreate is critical for nginx: scp above replaces the
            # config files with new inodes on the host, but the running nginx
            # container's bind mount is still attached to the old inode. Only
            # recreating the container re-attaches the mount to the current
            # file. For web/ws/celery this also guarantees they boot from the
            # freshly-pulled image even if the tag pointed somewhere unusual.
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for app to settle
        run: sleep 15

      - name: Curl /health/
        run: |
          curl -fsS --max-time 30 https://${{ secrets.EC2_HOST_DOMAIN }}/health/ \
            | tee /tmp/health.json
          grep -q '"status":\s*"ok"' /tmp/health.json
