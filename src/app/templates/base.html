{% load static %}<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LLM Portrait{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'users:landing' %}">LLM Portrait</a>
        <div class="ms-auto d-flex align-items-center">
            {% if user.is_authenticated %}
                <span class="text-light me-3">{{ user.username }}</span>
                <form method="post" action="{% url 'account_logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-outline-light btn-sm">Войти</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container py-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-toggle-password]");
    if (!btn) return;
    const input = document.getElementById(btn.dataset.togglePassword);
    if (!input) return;
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    btn.querySelector("i").className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";
});

document.addEventListener("submit", (e) => {
    const form = e.target.closest("[data-llm-form]");
    if (!form) return;
    const btn = form.querySelector("button[type=submit]");
    if (!btn) return;
    btn.disabled = true;
    form.querySelector(".generate-label")?.classList.add("d-none");
    form.querySelectorAll(".generate-loading").forEach((el) => el.classList.remove("d-none"));
});
</script>
</body>
</html>
