services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    # When DEBUGPY=1 we disable Django's autoreload. Autoreload snapshots
    # every Path on the project on a timer, which trips a known bug in
    # debugpy's Path-tracking and produces a noisy POSIXPath has no
    # attribute _hash error in the call-stack pane. We don't actually need
    # autoreload while we're paused on a breakpoint anyway.
    command: ["sh", "-c", "if [ \"$$DEBUGPY\" = \"1\" ]; then exec python manage.py runserver --noreload 0.0.0.0:8000; else exec python manage.py runserver 0.0.0.0:8000; fi"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./manage.py:/app/manage.py
      - ./pyproject.toml:/app/pyproject.toml
      # Schemas (AsyncAPI HTML for /ws/docs/, OpenAPI YAML written by
      # `make openapi-build`) live on the host and are mounted in. The whole
      # folder is bound rw so `make openapi-build` can write back to the host.
      - ./schemas:/app/schemas
    ports:
      - "8000:8000"
      - "5678:5678"  # debugpy (only listens when DEBUGPY=1; harmless otherwise)
    environment:
      DEBUGPY: ${DEBUGPY:-}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      ollama:
        condition: service_started

  ws:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    entrypoint: []
    command: python -m daphne -b 0.0.0.0 -p 8001 app.config.asgi:application
    volumes:
      - ./src:/app/src
      - ./manage.py:/app/manage.py
      - ./pyproject.toml:/app/pyproject.toml
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    entrypoint: []
    command: python -m celery -A app.config worker --loglevel=info
    volumes:
      - ./src:/app/src
      - ./manage.py:/app/manage.py
      - ./pyproject.toml:/app/pyproject.toml
    env_file: .env
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
