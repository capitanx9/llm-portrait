[project]
name = "llm-portrait"
version = "0.1.0"
description = "Django web application that generates personalized profile descriptions using a local LLM."
authors = [
    { name = "Kyrylo Triskalo", email = "capitanx9@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary] (>=3.3.3,<4.0.0)", "django (>=5.2,<6.0)", "python-decouple (>=3.8,<4.0)", "dj-database-url (>=3.1.2,<4.0.0)", "gunicorn (>=25.3.0,<26.0.0)", "django-allauth[socialaccount] (>=65.4.0,<66.0.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"
django-stubs = { version = "^5.0.0", extras = ["compatible-mypy"] }
pytest = "^8.3.0"
pytest-django = "^4.9.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# ------------------------------------------------------------------------------
# Ruff
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff_cache"
extend-exclude = [
    ".venv",
    "migrations",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # use of assert (allowed in tests)
    "RUF012", # mutable class attrs need ClassVar — Django Meta convention conflicts
    "RUF001", # ambiguous unicode (we have intentional Cyrillic in choices labels)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N802"]
"**/migrations/*.py" = ["E501", "N806", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# ------------------------------------------------------------------------------
# Mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
mypy_path = "src"
exclude = [
    "migrations",
    ".venv",
]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "app.config.settings.dev"


# ------------------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
DJANGO_SETTINGS_MODULE = "app.config.settings.dev"
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


# ------------------------------------------------------------------------------
# Coverage
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/migrations/*",
    "*/settings/*",
    "*/tests/*",
    "*/__init__.py",
    "*/manage.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
