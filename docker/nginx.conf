# Use Docker's embedded DNS so upstream names are resolved at request time
# rather than once at nginx start. Without this, nginx caches the upstream
# container's IP in memory; if web/ws is recreated by `docker compose up -d`
# (e.g. on every CD deploy) it gets a new IP and nginx keeps hitting the dead
# one until it's restarted manually. With a runtime resolver and variable
# upstreams, nginx re-queries Docker DNS at most every `valid=` window.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: ACME challenge for Let's Encrypt + redirect everything else to HTTPS.
server {
    listen 80;
    server_name llm-portrait.gotdns.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: real traffic.
server {
    listen 443 ssl;
    http2 on;
    server_name llm-portrait.gotdns.ch;

    ssl_certificate /etc/letsencrypt/live/llm-portrait.gotdns.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-portrait.gotdns.ch/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    location /ws/ {
        # Variable in proxy_pass forces runtime DNS resolution (see top-of-file note).
        set $daphne_upstream "ws:8001";
        proxy_pass http://$daphne_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived WS: don't close on idle for 1 hour.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # Variable in proxy_pass forces runtime DNS resolution (see top-of-file note).
        set $django_upstream "web:8000";
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
    }
}
