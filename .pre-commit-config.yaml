repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/api/ws/asyncapi\.html$
      - id: end-of-file-fixer
        exclude: ^docs/api/ws/asyncapi\.html$
      - id: check-yaml
      # docs/api/ws/asyncapi.html is the pre-rendered AsyncAPI documentation
      # (single-file output of @asyncapi/html-template — HTML + inlined
      # React runtime). It's committed alongside docs/api/ws/asyncapi.yaml
      # on purpose, the same way poetry.lock is committed alongside
      # pyproject.toml. Regenerated via `make asyncapi-build`.
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: ^docs/api/ws/asyncapi\.html$
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^docs/api/ws/asyncapi\.html$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
